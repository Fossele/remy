spring:
  application:
    name: messaging


  datasource:
    url: jdbc:mysql://localhost:3306/chat_db?useSSL=false&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:YourNewPassword123!}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10