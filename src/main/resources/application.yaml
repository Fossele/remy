spring:
  application:
    name: messaging


  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/messaging?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:YourNewPassword123!}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10

app:
  security:
    jwt:
      secret: ${JWT_SECRET:secret-key}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX, UTC} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.example.messaging: INFO
    org.springframework.security: WARN