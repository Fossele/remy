spring:
  application:
    name: messaging


  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/chat_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:YourNewPassword123!}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10

app:
  security:
    jwt:
      secret: ${JWT_SECRET:secret-key}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
  fapshi:
    base-url: ${FAPSHI_BASE_URL:https://sandbox.fapshi.com}
    collection-api-user: ${FAPSHI_COLLECTION_API_USER:}
    collection-api-key: ${FAPSHI_COLLECTION_API_KEY:}
    payout-api-user: ${FAPSHI_PAYOUT_API_USER:}
    payout-api-key: ${FAPSHI_PAYOUT_API_KEY:}
    webhook-secret: ${FAPSHI_WEBHOOK_SECRET:}
    webhook-url: ${FAPSHI_WEBHOOK_URL:}
    redirect-url: ${FAPSHI_REDIRECT_URL:}
  finance:
    reconciliation-delay-ms: ${FINANCE_RECONCILIATION_DELAY_MS:300000}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX, UTC} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.example.messaging: INFO
    org.springframework.security: WARN